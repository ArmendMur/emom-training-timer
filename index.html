<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>EMOM Training Timer</title>
  <style>
    :root {
      --bg-color: #080c15;
      --card-bg: #121929;
      --card-border: #1f2c47;
      --accent: #10b981; /* Neon Emerald */
      --accent-cyan: #06b6d4;
      --accent-glow: rgba(16, 185, 129, 0.4);
      --accent-warning: #f59e0b;
      --accent-danger: #ef4444;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      --font-digits: ui-monospace, 'SF Mono', Menlo, Monaco, Consolas, 'Roboto Mono', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      overflow-x: hidden;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: max(0.4rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) max(0.4rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      transition: background-color 0.3s ease;
    }

    /* Container: Auf Mobile kompakt & füllt 100dvh optimal aus, auf Desktop großzügig */
    .container {
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: clamp(0.35rem, 1vh, 0.75rem);
      transition: max-width 0.35s ease, padding 0.35s ease;
      min-height: 0;
    }

    @media (min-width: 900px) {
      body {
        height: auto;
        min-height: 100vh;
        overflow-y: auto;
        padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
      }

      .container {
        max-width: min(94vw, 1150px);
        height: auto;
        max-height: none;
      }
    }

    /* WIDE ARENA & MOBILE FIT MODE: Kein Scrollen, maximale Bildschirmhöhe */
    body.workout-active {
      height: 100vh;
      height: 100dvh;
      max-height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      padding: max(0.4rem, env(safe-area-inset-top)) max(0.75rem, env(safe-area-inset-right)) max(0.4rem, env(safe-area-inset-bottom)) max(0.75rem, env(safe-area-inset-left));
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    body.workout-active .container {
      width: 100%;
      max-width: 650px;
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0;
      min-height: 0;
    }

    body.workout-active .card {
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      padding: clamp(0.5rem, 1.6vh, 1.25rem) clamp(0.75rem, 2.5vw, 1.25rem);
    }

    body.workout-active .timer-display-view {
      height: 100%;
      max-height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      overflow: hidden;
    }

    /* Auf Mobile Bildschirmen: Vertikale Arena die 100% ohne Scrollen passt */
    @media (max-width: 899px) {
      body.workout-active .workout-grid {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        height: 100%;
        min-height: 0;
        gap: clamp(0.2rem, 0.8vh, 0.5rem);
        flex: 1;
        overflow: hidden;
      }

      body.workout-active .arena-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        flex: 1 1 auto;
        min-height: 0;
      }

      body.workout-active .top-status-header {
        margin-bottom: 0.15rem;
      }

      body.workout-active .status-badge {
        padding: 0.25rem 0.75rem;
        font-size: clamp(0.7rem, 1.4vh, 0.85rem);
      }

      body.workout-active .round-indicator {
        font-size: clamp(1.15rem, 2.4vh, 1.65rem);
        margin-bottom: clamp(0.1rem, 0.4vh, 0.35rem);
      }

      body.workout-active .progress-circle-wrap {
        width: min(44vmin, 26vh, 230px);
        height: min(44vmin, 26vh, 230px);
        margin: clamp(0.1rem, 0.4vh, 0.35rem) auto;
        flex-shrink: 1;
      }

      body.workout-active .arena-right {
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: clamp(0.25rem, 0.7vh, 0.5rem);
        flex: 0 0 auto;
        width: 100%;
      }

      body.workout-active .stats-dashboard {
        gap: 0.45rem;
      }

      body.workout-active .stat-card {
        padding: clamp(0.3rem, 0.8vh, 0.6rem) 0.5rem;
        border-radius: 0.75rem;
      }

      body.workout-active .stat-card .lbl {
        font-size: clamp(0.6rem, 1.1vh, 0.75rem);
        margin-bottom: 0.1rem;
      }

      body.workout-active .stat-card .val {
        font-size: clamp(1.3rem, 2.6vh, 1.85rem);
        line-height: 1.05;
      }

      body.workout-active .stat-card.status-phase {
        padding: clamp(0.25rem, 0.7vh, 0.5rem) 0.5rem;
      }

      body.workout-active .stat-card.status-phase .val {
        font-size: clamp(1.1rem, 2.2vh, 1.5rem);
      }

      body.workout-active .controls {
        gap: 0.5rem;
      }

      body.workout-active .btn {
        padding: clamp(0.55rem, 1.4vh, 0.85rem) 0.75rem;
        font-size: clamp(0.9rem, 1.9vh, 1.1rem);
        border-radius: 0.75rem;
      }
    }

    /* Auf Desktop PC (min-width: 900px): Horizontales Arena Stadium Layout */
    @media (min-width: 900px) {
      body.workout-active {
        height: 100vh;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: clamp(0.75rem, 1.5vh, 1.5rem) clamp(1rem, 2vw, 2rem);
      }

      body.workout-active .container {
        width: 100%;
        max-width: min(98vw, 1950px);
        height: calc(100vh - 2rem);
        max-height: calc(100vh - 2rem);
        display: flex;
        flex-direction: column;
        justify-content: center;
      }

      body.workout-active .card {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(1.25rem, 2.5vw, 2.8rem) clamp(1.75rem, 3.5vw, 4.5rem);
      }

      body.workout-active .timer-display-view {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }

      body.workout-active .workout-grid {
        flex: 1;
        display: grid;
        grid-template-columns: 1.25fr 1fr;
        align-items: center;
        gap: clamp(2.5rem, 5vw, 6.5rem);
        width: 100%;
      }

      body.workout-active .arena-left {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        width: 100%;
      }

      body.workout-active .progress-circle-wrap {
        width: min(58vmin, 620px);
        height: min(58vmin, 620px);
        margin: 0.5rem auto;
      }

      body.workout-active .minute-seconds-text {
        font-size: clamp(5rem, 36cqw, 14.5rem);
      }

      body.workout-active .minute-subtext {
        font-size: clamp(0.85rem, 5.2cqw, 1.4rem);
      }

      body.workout-active .round-indicator {
        font-size: clamp(2rem, 3.5vw, 3.6rem);
        margin-bottom: 1.25rem;
      }

      body.workout-active .arena-right {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: clamp(1.2rem, 2.2vh, 2rem);
        width: 100%;
      }

      body.workout-active .stat-card {
        padding: clamp(1.2rem, 2.5vh, 2.4rem) clamp(1.2rem, 2vw, 2.2rem);
      }

      body.workout-active .stat-card .lbl {
        font-size: clamp(0.95rem, 1.2vw, 1.25rem);
        margin-bottom: 0.5rem;
      }

      body.workout-active .stat-card .val {
        font-size: clamp(2.6rem, 4.5vw, 5.5rem);
      }

      body.workout-active .stat-card.status-phase .val {
        font-size: clamp(2.4rem, 4vw, 4.5rem);
      }

      body.workout-active .controls {
        gap: clamp(1rem, 2vw, 1.75rem);
      }

      body.workout-active .btn {
        padding: clamp(1.2rem, 2.5vh, 1.75rem) clamp(1.5rem, 2.5vw, 2.5rem);
        font-size: clamp(1.25rem, 1.8vw, 1.6rem);
      }
    }

    header {
      text-align: center;
      transition: all 0.3s ease;
    }

    header h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #34d399, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    header p {
      color: var(--text-muted);
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      margin-top: 0.25rem;
    }

    /* Im Workout-Modus ist der Header dezenter */
    body.workout-active header {
      display: none;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: clamp(1.25rem, 3vw, 2.25rem);
      padding: clamp(1.25rem, 3vw, 2.5rem);
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6), 0 10px 15px -8px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow: hidden;
      width: 100%;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    /* Optischer Puls bei neuem Minuten-Beginn */
    .card.flash-minute {
      animation: pulseGreen 0.75s ease-out;
    }

    @keyframes pulseGreen {
      0% {
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.9), 0 0 50px var(--accent-glow);
        border-color: #34d399;
      }
      60% {
        box-shadow: 0 0 0 25px rgba(16, 185, 129, 0), 0 0 60px var(--accent-glow);
      }
      100% {
        box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.6);
        border-color: var(--card-border);
      }
    }

    /* =========================================
       SETUP VIEW
       ========================================= */
    .setup-group {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .setup-grid {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      width: 100%;
    }

    .setup-col {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .setup-col-right {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      justify-content: space-between;
    }

    .input-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .number-input-wrapper {
      position: relative;
      margin-top: 0.5rem;
    }

    input[type="number"] {
      width: 100%;
      background: #090e1a;
      border: 2px solid var(--card-border);
      color: #fff;
      font-size: 2.25rem;
      font-family: var(--font-digits);
      font-weight: 800;
      text-align: center;
      border-radius: 1.25rem;
      padding: 0.85rem;
      outline: none;
      transition: all 0.2s ease;
      font-variant-numeric: tabular-nums;
    }

    input[type="number"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
    }

    .quick-presets {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      margin-top: 0.5rem;
    }

    .btn-preset {
      background: #192237;
      border: 1px solid #2b3959;
      color: var(--text-main);
      padding: 0.75rem 0.5rem;
      border-radius: 0.9rem;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-preset:hover {
      background: #23304e;
      border-color: #3b4f7d;
      transform: translateY(-1px);
    }

    .btn-preset.active {
      background: var(--accent);
      color: #032e25;
      border-color: var(--accent);
      box-shadow: 0 3px 12px var(--accent-glow);
    }

    .options-row {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      background: #090e1a;
      padding: 1rem 1.25rem;
      border-radius: 1rem;
      border: 1px solid #1a253d;
      margin-top: 0.5rem;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.95rem;
      color: #cbd5e1;
      cursor: pointer;
    }

    .toggle-label input[type="checkbox"] {
      width: 1.25rem;
      height: 1.25rem;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .sound-settings-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      background: #0b1120;
      padding: 0.95rem 1.2rem;
      border-radius: 1rem;
      border: 1px solid #1a253d;
    }

    .btn-start-workout {
      font-size: clamp(1.2rem, 2.5vw, 1.45rem);
      padding: clamp(1.15rem, 2vh, 1.4rem);
      width: 100%;
    }

    /* Auf Mobile Bildschirmen: Setup-Menü nutzt die Bildschirmhöhe optimal aus */
    @media (max-width: 899px) {
      header {
        flex: 0 0 auto;
        padding: clamp(0.15rem, 0.6vh, 0.4rem) 0 0.1rem;
      }

      header h1 {
        font-size: clamp(1.45rem, 3.2vh, 2.1rem);
      }

      header p {
        font-size: clamp(0.75rem, 1.4vh, 0.9rem);
        margin-top: 0.1rem;
      }

      .card {
        flex: 1 1 auto;
        height: 100%;
        max-height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        padding: clamp(0.65rem, 1.8vh, 1.25rem) clamp(0.75rem, 2.5vw, 1.25rem);
        border-radius: clamp(1.15rem, 2.5vw, 1.65rem);
        min-height: 0;
        overflow: hidden;
      }

      #setupView {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        flex: 1;
        min-height: 0;
      }

      .setup-grid {
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        flex: 1;
        min-height: 0;
        gap: clamp(0.35rem, 1.1vh, 0.75rem);
      }

      .setup-col {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: clamp(0.35rem, 1vh, 0.75rem);
      }

      .setup-col-right {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: clamp(0.35rem, 1vh, 0.75rem);
        flex: 1;
      }

      .input-label {
        font-size: clamp(0.72rem, 1.3vh, 0.85rem);
      }

      .number-input-wrapper {
        margin-top: clamp(0.15rem, 0.5vh, 0.35rem);
      }

      input[type="number"] {
        font-size: clamp(1.6rem, 3.5vh, 2.25rem);
        padding: clamp(0.4rem, 1vh, 0.65rem);
        border-radius: 0.85rem;
      }

      .quick-presets {
        gap: clamp(0.25rem, 0.6vh, 0.5rem);
        margin-top: clamp(0.15rem, 0.5vh, 0.35rem);
      }

      .btn-preset {
        padding: clamp(0.42rem, 1.1vh, 0.65rem) 0.25rem;
        font-size: clamp(0.78rem, 1.5vh, 0.92rem);
        border-radius: 0.65rem;
      }

      .options-row {
        padding: clamp(0.45rem, 1.1vh, 0.75rem) 0.85rem;
        gap: clamp(0.25rem, 0.6vh, 0.45rem);
        border-radius: 0.85rem;
        margin-top: clamp(0.15rem, 0.5vh, 0.35rem);
      }

      .toggle-label {
        font-size: clamp(0.78rem, 1.5vh, 0.9rem);
        gap: 0.55rem;
      }

      .toggle-label input[type="checkbox"] {
        width: 1.15rem;
        height: 1.15rem;
      }

      .sound-settings-bar {
        padding: clamp(0.42rem, 1.1vh, 0.75rem) 0.85rem;
        border-radius: 0.85rem;
        gap: 0.5rem;
      }

      .sound-settings-bar span {
        font-size: clamp(0.7rem, 1.3vh, 0.82rem) !important;
      }

      .btn-test {
        font-size: clamp(0.74rem, 1.3vh, 0.85rem);
        padding: 0.35rem 0.65rem;
      }

      .btn-start-workout {
        padding: clamp(0.75rem, 1.8vh, 1.15rem) 1rem;
        font-size: clamp(1.05rem, 2.2vh, 1.35rem);
        border-radius: 0.9rem;
      }
    }

    @media (min-width: 900px) {
      .setup-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 2.75rem;
        align-items: stretch;
      }

      .setup-col-right {
        height: 100%;
      }

      .btn-start-workout {
        margin-top: auto;
        font-size: 1.4rem;
        padding: 1.35rem;
      }

      .quick-presets {
        gap: 0.75rem;
      }

      .btn-preset {
        padding: 0.95rem 0.5rem;
        font-size: 1.05rem;
      }

      input[type="number"] {
        font-size: 2.75rem;
        padding: 1rem;
      }
    }

    /* =========================================
       WORKOUT TIMER VIEW (ARENA MODE)
       ========================================= */
    .timer-display-view {
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    /* Auf Desktop PC: Großes 2-Spalten Layout */
    .workout-grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      width: 100%;
    }


    /* Linke Spalte: Runder Stadium-Timer */
    .arena-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    /* Rechte Spalte: Stats & Kontrollen */
    .arena-right {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1.5rem;
      width: 100%;
    }

    .top-status-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      margin-bottom: 0.5rem;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      border-radius: 9999px;
      font-size: clamp(0.9rem, 2vw, 1.15rem);
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 2px solid rgba(16, 185, 129, 0.35);
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
    }

    .status-badge.prep {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.45);
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.2);
    }

    .status-badge.paused {
      background: rgba(239, 68, 68, 0.2);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.45);
      box-shadow: 0 0 20px rgba(239, 68, 68, 0.2);
    }

    .status-badge.finished {
      background: rgba(6, 182, 212, 0.2);
      color: #38bdf8;
      border-color: rgba(6, 182, 212, 0.45);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.2);
    }

    .round-indicator {
      font-size: clamp(1.8rem, 4.5vw, 3.25rem);
      font-weight: 900;
      color: #f1f5f9;
      letter-spacing: -0.02em;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .round-indicator span {
      color: var(--accent);
      text-shadow: 0 0 15px var(--accent-glow);
    }

    /* Riesiger Fortschrittsring */
    .progress-circle-wrap {
      position: relative;
      width: min(44vmin, 26vh, 260px);
      height: min(44vmin, 26vh, 260px);
      margin: 0.35rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
      container-type: inline-size;
    }

    .progress-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .progress-bg {
      fill: none;
      stroke: #162035;
      stroke-width: 14;
    }

    .progress-bar {
      fill: none;
      stroke: var(--accent);
      stroke-width: 14;
      stroke-linecap: round;
      stroke-dasharray: 754;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.08s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 8px var(--accent-glow));
    }

    .progress-bar.warning {
      stroke: var(--accent-warning);
      filter: drop-shadow(0 0 10px rgba(245, 158, 11, 0.5));
    }

    .circle-content {

    /* Screen Shake & Pulse */

      0% { transform: scale(1); }
      40% { transform: scale(1.09); }

    }

    /* =========================================
       FOOTER & IPHONE WAKE LOCK INDICATOR
       ========================================= */
    .footer-bar {

  </style>

<body>

  <div class="container">

    <div class="card" id="mainCard">

  </div>

  <script>
    // =========================================================================
    // 1. BULLETPROOF SCREEN SLEEP PREVENTION (iPhone / iOS & PC / Android)
    // =========================================================================
    // iOS Safari schaltet oft nach 30-60 Sekunden ab, falls keine aktive Video-/
    // Medienwiedergabe läuft. Wir kombinieren:
    // a) Native Screen Wake Lock API (Desktop & moderne Browser)
    // b) Unsichtbare stumme Loop-Videowiedergabe (NoSleep-Technik speziell für iPhone Safari)
    const nosleepVideo = document.getElementById('nosleep-video');
    let wakeLockSentinel = null;
    let isWakeLockEnabled = false;

    async function enableSleepPrevention() {
      isWakeLockEnabled = true;

      // 1. iOS Safari Workaround: Stummes Endlos-Video abspielen
      if (nosleepVideo) {
        try {
          const playPromise = nosleepVideo.play();
          if (playPromise !== undefined) {
            playPromise.catch(err => {
              // Browser blockierte Autoplay noch vor Nutzergeste
              console.log('Video autoplay wartet auf Interaktion:', err);
            });
          }
        } catch (e) {
          console.warn('Video play error:', e);
        }
      }

      // 2. Native Wake Lock API anfordern
      if ('wakeLock' in navigator) {
        try {
          if (!wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
              wakeLockSentinel = null;
              if (isWakeLockEnabled && document.visibilityState === 'visible') {
                enableSleepPrevention();
              }
            });
          }
        } catch (err) {
          console.log('WakeLock API nicht verfügbar (Video-Fallback aktiv):', err);
        }
      }
    }

    function disableSleepPrevention() {
      isWakeLockEnabled = false;
      if (wakeLockSentinel) {
        wakeLockSentinel.release().catch(() => {});
        wakeLockSentinel = null;
      }
      if (nosleepVideo) {
        try {
          nosleepVideo.pause();
        } catch (e) {}
      }
    }

    // Sofort bei Nutzer-Berührung (Touch/Click) den Schutz aktivieren
    ['touchstart', 'touchend', 'click'].forEach(evtType => {
      document.addEventListener(evtType, () => {
        if (!isWakeLockEnabled || (nosleepVideo && nosleepVideo.paused)) {
          enableSleepPrevention();
        }
      }, { passive: true });
    });

    // Re-aktivieren, wenn Tab wieder in den Vordergrund kommt (z.B. iPhone entsperrt)
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        enableSleepPrevention();
      }
    });
    window.addEventListener('focus', enableSleepPrevention);
    window.addEventListener('pageshow', enableSleepPrevention);

    // Initial versuchen direkt zu aktivieren
    enableSleepPrevention();

    // =========================================================================
    // 2. WEB AUDIO API SYNTHESIZER (100% Offline & Zuverlässig)
    // =========================================================================
    let audioCtx = null;
    const volumeSlider = document.getElementById('volumeSlider');

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function getMasterVolume() {
      return volumeSlider ? parseFloat(volumeSlider.value) : 0.75;
    }

    function playBeep(frequency, durationMs, type = 'sine', volume = 0.7) {
      try {
        const ctx = getAudioContext();
        if (!ctx) return;

        const effectiveVolume = volume * getMasterVolume();
        if (effectiveVolume <= 0.001) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(frequency, ctx.currentTime);

        gain.gain.setValueAtTime(0.001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(effectiveVolume, ctx.currentTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (durationMs / 1000));

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + (durationMs / 1000) + 0.05);
      } catch (err) {
        console.warn('Audio play error:', err);
      }
    }

    function playWarningBeep() {
      playBeep(520, 150, 'triangle', 0.6);
    }

    function playNewMinuteSignal() {
      // Markanter Doppelton (Gong/Gym Signal)
      playBeep(880, 200, 'sine', 0.85);
      setTimeout(() => {
        playBeep(1174.66, 350, 'sine', 0.95);
      }, 160);
    }

    function playWorkoutCompleteSignal() {
      const notes = [587.33, 739.99, 880, 1174.66];
      notes.forEach((freq, idx) => {
        setTimeout(() => {
          playBeep(freq, 300, 'triangle', 0.9);
        }, idx * 190);
      });
    }

    // =========================================================================
    // 3. TIMER LOGIK & ARENA DISPLAY
    // =========================================================================
    let totalMinutes = 30;
    let prepSeconds = 10;
    let hasPrep = true;
    let hasWarningBeeps = true;

    let isRunning = false;
    let isPaused = false;
    let isPrepPhase = false;

    let startTime = 0;
    let pausedTimeAccumulated = 0;
    let pauseStartTimestamp = 0;
    let animationFrameId = null;

    let totalDurationMs = 0;
    let prepDurationMs = 0;
    let lastWarningSecond = -1;
    let lastAnnouncedRound = 0;

    // DOM Elements
    const setupView = document.getElementById('setupView');
    const timerView = document.getElementById('timerView');
    const mainCard = document.getElementById('mainCard');
    const minutesInput = document.getElementById('minutesInput');
    const prepCheckbox = document.getElementById('prepCountdownCheckbox');
    const warningBeepsCheckbox = document.getElementById('warningBeepsCheckbox');

    const statusBadge = document.getElementById('statusBadge');
    const currentRoundEl = document.getElementById('currentRound');
    const totalRoundsEl = document.getElementById('totalRounds');
    const minuteTimerDisplay = document.getElementById('minuteTimerDisplay');
    const minuteTimerSubtext = document.getElementById('minuteTimerSubtext');
    const progressBar = document.getElementById('progressBar');
    const totalRemainingDisplay = document.getElementById('totalRemainingDisplay');
    const totalElapsedDisplay = document.getElementById('totalElapsedDisplay');
    const currentIntervalDisplay = document.getElementById('currentIntervalDisplay');

    const btnStart = document.getElementById('btnStart');
    const btnPauseResume = document.getElementById('btnPauseResume');
    const btnReset = document.getElementById('btnReset');
    const btnTestSound = document.getElementById('btnTestSound');
    const presetButtons = document.querySelectorAll('.btn-preset');

    const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * 120; // ~753.98

    // Presets Click Handler
    presetButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        presetButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const min = parseInt(btn.dataset.min, 10);
        minutesInput.value = min;
      });
    });

    minutesInput.addEventListener('input', () => {
      const val = parseInt(minutesInput.value, 10);
      presetButtons.forEach(b => {
        if (parseInt(b.dataset.min, 10) === val) {
          b.classList.add('active');
        } else {
          b.classList.remove('active');
        }
      });
    });

    btnTestSound.addEventListener('click', () => {
      getAudioContext();
      enableSleepPrevention();
      playNewMinuteSignal();
    });

    btnStart.addEventListener('click', () => {
      let mins = parseInt(minutesInput.value, 10);
      if (isNaN(mins) || mins <= 0) {
        mins = 30;
        minutesInput.value = 30;
      }
      totalMinutes = mins;
      hasPrep = prepCheckbox.checked;
      hasWarningBeeps = warningBeepsCheckbox.checked;
      prepSeconds = hasPrep ? 10 : 0;

      getAudioContext();
      enableSleepPrevention();
      startWorkout();
    });

    function startWorkout() {
      isRunning = true;
      isPaused = false;
      isPrepPhase = prepSeconds > 0;
      pausedTimeAccumulated = 0;
      lastWarningSecond = -1;
      lastAnnouncedRound = 0;

      prepDurationMs = prepSeconds * 1000;
      totalDurationMs = totalMinutes * 60 * 1000;

      // Auf Arena Mode umschalten (Desktop erweitert Container)
      document.body.classList.add('workout-active');
      setupView.style.display = 'none';
      timerView.style.display = 'flex';
      totalRoundsEl.textContent = totalMinutes;

      btnPauseResume.textContent = '⏸ Pause';
      btnPauseResume.className = 'btn btn-pause';

      startTime = performance.now();

      if (!isPrepPhase) {
        lastAnnouncedRound = 1;
        triggerMinuteTransition(1);
      }

      tick();
    }

    function tick() {
      if (!isRunning) return;

      const now = performance.now();
      let elapsedTotal = 0;

      if (!isPaused) {
        elapsedTotal = now - startTime - pausedTimeAccumulated;
      } else {
        elapsedTotal = pauseStartTimestamp - startTime - pausedTimeAccumulated;
      }

      if (isPrepPhase) {
        handlePrepPhase(elapsedTotal);
      } else {
        handleWorkoutPhase(elapsedTotal);
      }

      if (isRunning) {
        animationFrameId = requestAnimationFrame(tick);
      }
    }

    function handlePrepPhase(elapsedTotal) {
      const prepRemainingMs = Math.max(0, prepDurationMs - elapsedTotal);
      const remainingSec = Math.ceil(prepRemainingMs / 1000);

      statusBadge.textContent = 'Vorbereitung';
      statusBadge.className = 'status-badge prep';
      currentRoundEl.textContent = 'Bereitmachen';
      currentIntervalDisplay.textContent = 'Start in ' + remainingSec + 's';

      minuteTimerDisplay.textContent = remainingSec;
      minuteTimerSubtext.textContent = 'Bis Start';

      const progressRatio = prepRemainingMs / prepDurationMs;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - progressRatio);
      progressBar.style.strokeDashoffset = offset;
      progressBar.classList.add('warning');

      totalRemainingDisplay.textContent = formatTimeMS(totalMinutes * 60);
      totalElapsedDisplay.textContent = '00:00';

      if (remainingSec <= 5 && remainingSec > 0 && remainingSec !== lastWarningSecond) {
        lastWarningSecond = remainingSec;
        playWarningBeep();
      }

      if (prepRemainingMs <= 0) {
        isPrepPhase = false;
        startTime = performance.now();
        pausedTimeAccumulated = 0;
        lastWarningSecond = -1;
        progressBar.classList.remove('warning');

        lastAnnouncedRound = 1;
        triggerMinuteTransition(1);
      }
    }

    function handleWorkoutPhase(elapsedTotal) {
      if (elapsedTotal >= totalDurationMs) {
        finishWorkout();
        return;
      }

      statusBadge.textContent = isPaused ? 'Pausiert' : 'EMOM Läuft';
      statusBadge.className = isPaused ? 'status-badge paused' : 'status-badge';

      const currentMinuteIndex = Math.floor(elapsedTotal / 60000);
      const currentRoundNumber = currentMinuteIndex + 1;
      const msInCurrentMinute = elapsedTotal % 60000;
      const remainingMsInMinute = 60000 - msInCurrentMinute;
      const remainingSecInMinute = Math.ceil(remainingMsInMinute / 1000);

      currentRoundEl.textContent = currentRoundNumber;
      currentIntervalDisplay.textContent = `Runde ${currentRoundNumber}`;

      minuteTimerDisplay.textContent = remainingSecInMinute === 60 ? '60' : String(remainingSecInMinute).padStart(2, '0');
      minuteTimerSubtext.textContent = 'Sekunden';

      const minuteRatio = remainingMsInMinute / 60000;
      const offset = CIRCLE_CIRCUMFERENCE * (1 - minuteRatio);
      progressBar.style.strokeDashoffset = offset;

      if (remainingSecInMinute <= 5) {
        progressBar.classList.add('warning');
      } else {
        progressBar.classList.remove('warning');
      }

      const totalRemainingSec = Math.ceil((totalDurationMs - elapsedTotal) / 1000);
      const totalElapsedSec = Math.floor(elapsedTotal / 1000);

      totalRemainingDisplay.textContent = formatTimeMS(totalRemainingSec);
      totalElapsedDisplay.textContent = formatTimeMS(totalElapsedSec);

      // Neue Minute erreicht
      if (currentRoundNumber > lastAnnouncedRound) {
        lastAnnouncedRound = currentRoundNumber;
        lastWarningSecond = -1;
        triggerMinuteTransition(currentRoundNumber);
      }

      // 5-4-3-2-1 Vorwarnung vor der neuen Minute
      if (hasWarningBeeps) {
        if (remainingSecInMinute <= 5 && remainingSecInMinute >= 1) {
          if (lastWarningSecond !== remainingSecInMinute) {
            lastWarningSecond = remainingSecInMinute;
            playWarningBeep();
          }
        } else if (remainingSecInMinute > 5) {
          lastWarningSecond = -1;
        }
      }
    }

    function triggerMinuteTransition(roundNum) {
      playNewMinuteSignal();

      mainCard.classList.remove('flash-minute');
      void mainCard.offsetWidth;
      mainCard.classList.add('flash-minute');

      minuteTimerDisplay.classList.add('pulse-text');
      setTimeout(() => {
        minuteTimerDisplay.classList.remove('pulse-text');
      }, 500);
    }

    function finishWorkout() {
      isRunning = false;
      isPaused = false;
      cancelAnimationFrame(animationFrameId);

      statusBadge.textContent = 'Abgeschlossen! 🎉';
      statusBadge.className = 'status-badge finished';

      minuteTimerDisplay.textContent = '00';
      minuteTimerSubtext.textContent = 'Fertig! 🎉';
      progressBar.style.strokeDashoffset = CIRCLE_CIRCUMFERENCE;
      totalRemainingDisplay.textContent = '00:00';
      totalElapsedDisplay.textContent = formatTimeMS(totalMinutes * 60);

      btnPauseResume.style.display = 'none';

      playWorkoutCompleteSignal();
    }

    btnPauseResume.addEventListener('click', () => {
      if (!isRunning) return;

      if (!isPaused) {
        isPaused = true;
        pauseStartTimestamp = performance.now();
        btnPauseResume.textContent = '▶ Fortsetzen';
        btnPauseResume.className = 'btn btn-primary';
        statusBadge.textContent = 'Pausiert';
        statusBadge.className = 'status-badge paused';
      } else {
        isPaused = false;
        pausedTimeAccumulated += (performance.now() - pauseStartTimestamp);
        btnPauseResume.textContent = '⏸ Pause';
        btnPauseResume.className = 'btn btn-pause';
        enableSleepPrevention();
      }
    });

    btnReset.addEventListener('click', () => {
      resetWorkout();
    });

    function resetWorkout() {
      isRunning = false;
      isPaused = false;
      isPrepPhase = false;
      cancelAnimationFrame(animationFrameId);

      document.body.classList.remove('workout-active');
      timerView.style.display = 'none';
      setupView.style.display = 'flex';
      btnPauseResume.style.display = 'inline-flex';

      progressBar.style.strokeDashoffset = 0;
      progressBar.classList.remove('warning');
      mainCard.classList.remove('flash-minute');
      lastWarningSecond = -1;
      lastAnnouncedRound = 0;
    }

    function formatTimeMS(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }
  </script>
</body>
</html>
